<!DOCTYPE html>
<html lang="ru"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход · Security Lab</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<main class="login-card">
    <div class="brand-mark" aria-hidden="true">S</div>
    <p class="eyebrow">SPRING SECURITY LAB</p>
    <h1>Добро пожаловать</h1>
    <p class="login-subtitle">Войдите, чтобы посмотреть список пользователей и проверить ролевой доступ.</p>

    <div class="alert alert-error" th:if="${param.error}">
        Неверный логин или пароль. Попробуйте ещё раз.
    </div>
    <div class="alert alert-success" th:if="${param.logout}">
        Вы успешно вышли из системы.
    </div>

    <form class="login-form" method="post" th:action="@{/login}">
        <label for="username">Логин</label>
        <input id="username"
               type="text"
               name="username"
               placeholder="Введите логин"
               autocomplete="username"
               autofocus
               required>

        <label for="password">Пароль</label>
        <input id="password"
               type="password"
               name="password"
               placeholder="Введите пароль"
               autocomplete="current-password"
               required>

        <button class="primary-button" type="submit">Войти</button>
    </form>

    <div class="demo-hint">
        <span>Демо-доступ</span>
        <code>user1</code>
        <span>/</span>
        <code>password</code>
    </div>
</main>
</body>
</html>
