spring:
  config:
    activate:
      on-profile: prod

server:
  port: ${SERVER_PORT:8443}
  ssl:
    enabled: true
    key-store: ${SSL_KEY_STORE}
    key-store-password: ${SSL_KEY_STORE_PASSWORD}
    key-store-type: ${SSL_KEY_STORE_TYPE:PKCS12}
    key-alias: ${SSL_KEY_ALIAS:app}
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax
